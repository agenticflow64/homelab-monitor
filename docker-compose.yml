# docker-compose.yml — homelab-monitor
# Запуск: cp .env.example .env && заполнить ключи, затем make up

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: homelab-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - monitoring-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: homelab-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  node_exporter:
    # Метрики хоста. profile "full" — поднимается по желанию:
    #   make up (= docker compose --profile full up -d)
    image: prom/node-exporter:v1.9.0
    container_name: homelab-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    ports:
      - "9100:9100"
    profiles: ["full"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: homelab-loki
    volumes:
      - monitoring-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: homelab-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - monitoring-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  alert-agent:
    build: ./agent
    container_name: homelab-alert-agent
    env_file: .env
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - AGENT_DATA_DIR=/app/data
      - GROUP_COOLDOWN_SECONDS=${GROUP_COOLDOWN_SECONDS:-600}
    volumes:
      - ./agent/data:/app/data
    ports:
      - "8081:8080"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  monitoring-data:
