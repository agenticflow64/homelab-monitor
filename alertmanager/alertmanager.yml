# alertmanager.yml — маршрутизация алертов в alert-agent
global:
  resolve_timeout: 1m

route:
  receiver: agent
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 3h
  routes:
    - receiver: agent

receivers:
  - name: agent
    webhook_configs:
      # alert-agent работает в host-сети -> адресуемся через host-gateway
      - url: http://host.docker.internal:8081/webhook
        send_resolved: true
        max_alerts: 0
